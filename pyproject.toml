[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rap-weather"
version = "1.0.0"
description = "Region-aware patch embeddings for satellite image sequence retrieval (IEEE Access)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ki-Yeon Park" },
    { name = "Ha-Myung Park" },
]

[tool.setuptools.packages.find]
include = ["rap_weather*"]
